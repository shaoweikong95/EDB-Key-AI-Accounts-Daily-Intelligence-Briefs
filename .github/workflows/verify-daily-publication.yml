name: Verify daily intelligence publication
on:
  schedule:
    - cron: '00 23 * * *' # 07:00 Singapore time, after recovery attempts
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare Singapore date with GitHub and live Cloudflare
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, re, urllib.request, sys
          from zoneinfo import ZoneInfo
          expected=datetime.datetime.now(ZoneInfo('Asia/Singapore')).strftime('%-d %b %Y')
          local=open('data/latest.js',encoding='utf-8').read()
          url='https://edb-key-ai-accounts-daily-intelligence-briefs.pages.dev/data/latest.js'
          req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'DailyBriefPublicationCheck/1.0'})
          with urllib.request.urlopen(req,timeout=30) as response:
              live=response.read().decode('utf-8')
          pattern=r"date:\s*['\"]([^'\"]+)['\"]"
          local_date=re.search(pattern,local)
          live_date=re.search(pattern,live)
          local_date=local_date.group(1) if local_date else 'MISSING'
          live_date=live_date.group(1) if live_date else 'MISSING'
          print(f'Expected: {expected}; GitHub: {local_date}; Cloudflare: {live_date}')
          if local_date!=expected or live_date!=expected:
              print('::error::Daily brief not published to GitHub and Cloudflare for current Singapore date.')
              sys.exit(1)
          if local!=live:
              print('::error::GitHub and Cloudflare data/latest.js differ.')
              sys.exit(1)
          print('Publication verified.')
          PY
