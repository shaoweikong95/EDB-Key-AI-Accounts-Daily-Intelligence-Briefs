name: Weekly Hiring Audit
on:
  push:
    branches: [main]
    paths:
      - 'weekly-hiring/**'
      - '.github/workflows/weekly-hiring-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 0' # Sundays at 21:00 Asia/Singapore
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test canonical audit integrity
        run: python -m unittest discover -s weekly-hiring -p 'test_*.py'
      - name: Collect first-party ATS jobs and validate
        run: python weekly-hiring/collect.py weekly-hiring/boards.json
      - name: Preserve diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-hiring-audit
          path: weekly-hiring-output/
          if-no-files-found: warn
          retention-days: 90
