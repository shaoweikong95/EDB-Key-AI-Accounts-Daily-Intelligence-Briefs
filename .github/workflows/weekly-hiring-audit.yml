name: Weekly Hiring Audit
on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 0'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and validate first-party ATS jobs
        run: python weekly-hiring/collect.py weekly-hiring/boards.json
      - name: Preserve audit and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-hiring-audit
          path: weekly-hiring-output/
          if-no-files-found: warn
          retention-days: 90
