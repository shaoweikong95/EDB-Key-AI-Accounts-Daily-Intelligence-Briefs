name: Weekly Hiring Audit
on:
  push:
    branches: [main]
    paths:
      - 'weekly-hiring/**'
      - '.github/workflows/weekly-hiring-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 0' # Sundays at 21:00 Asia/Singapore
permissions:
  contents: write
concurrency:
  group: weekly-hiring-production
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all pipeline components
        run: python -m compileall -q weekly-hiring
      - name: Test canonical audit integrity
        run: python -m unittest discover -s weekly-hiring -p 'test_*.py'
      - name: Collect first-party ATS jobs and validate
        run: python weekly-hiring/collect.py weekly-hiring/boards.json
      - name: Render frozen validated dashboard
        run: python weekly-hiring/render.py weekly-hiring-output weekly-hiring/index.html
      - name: Update and verify historical Google Sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python -m pip install --quiet google-auth requests
          python weekly-hiring/sheets_publish.py weekly-hiring-output
      - name: Commit verified weekly hiring dashboard for Cloudflare
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly-hiring/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified weekly hiring dashboard"
            git push origin HEAD:main
          fi
      - name: Verify public Cloudflare and send weekly link
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SENDER: shaoweikong@gmail.com
        run: python weekly-hiring/verify_and_email.py
      - name: Preserve audit, validation and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-hiring-audit
          path: weekly-hiring-output/
          if-no-files-found: warn
          retention-days: 90
